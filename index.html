<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WalkBuddy Helper</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    input, button {
      padding: 12px;
      margin: 8px;
      font-size: 16px;
    }

    #remote-player {
      width: 80%;
      max-width: 800px;
      height: 500px;
      margin: 20px auto;
      background: black;
    }

    #local-player {
      width: 300px;
      height: 200px;
      margin: 20px auto;
      background: black;
    }
  </style>
</head>

<body>
  <h1>WalkBuddy Helper</h1>

  <input id="appId" placeholder="Agora App ID" />
  <input id="token" placeholder="Temporary Token" />

  <br />

  <button onclick="joinCall()">Join Call</button>
  <button onclick="leaveCall()">Leave Call</button>

  <p id="status">Not connected</p>

  <h2>WalkBuddy User</h2>
  <div id="remote-player"></div>

  <h2>Helper Camera</h2>
  <div id="local-player"></div>

  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.23.4.js"></script>

  <script>
    const CHANNEL = "test-walkbuddy";

    let client;
    let localAudioTrack;
    let localVideoTrack;

    async function joinCall() {
      const appId = document.getElementById("appId").value.trim();
      const token = document.getElementById("token").value.trim();

      const status = document.getElementById("status");

      try {
        status.innerText = "Joining...";

        client = AgoraRTC.createClient({
          mode: "rtc",
          codec: "vp8"
        });

        client.on("user-published", async (user, mediaType) => {
          await client.subscribe(user, mediaType);

          console.log("Remote user published:", user.uid, mediaType);

          if (mediaType === "video") {
            user.videoTrack.play("remote-player");
          }

          if (mediaType === "audio") {
            user.audioTrack.play();
          }
        });

        client.on("user-unpublished", (user, mediaType) => {
          console.log("Remote user unpublished:", user.uid, mediaType);
        });

        client.on("user-left", (user) => {
          console.log("Remote user left:", user.uid);
          status.innerText = "WalkBuddy user disconnected";
        });

        await client.join(
          appId,
          CHANNEL,
          token,
          2
        );

        status.innerText = "Joined channel";

        [localAudioTrack, localVideoTrack] =
          await AgoraRTC.createMicrophoneAndCameraTracks();

        localVideoTrack.play("local-player");

        await client.publish([
          localAudioTrack,
          localVideoTrack
        ]);

        status.innerText = "Connected";
      }
      catch (error) {
        console.error(error);
        status.innerText =
          "Error: " + (error.message || error);
      }
    }

    async function leaveCall() {
      try {
        if (localAudioTrack) {
          localAudioTrack.stop();
          localAudioTrack.close();
        }

        if (localVideoTrack) {
          localVideoTrack.stop();
          localVideoTrack.close();
        }

        if (client) {
          await client.leave();
        }

        document.getElementById("status").innerText =
          "Disconnected";
      }
      catch (error) {
        console.error(error);
      }
    }
  </script>
</body>
</html>
